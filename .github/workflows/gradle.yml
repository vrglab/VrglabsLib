name: Java CI with Gradle

on:
  push:
    branches:
      - "dev/*"
      - "dev/**"
  pull_request:
    branches:
      - "master"
      - "main/*"
      - "main/**"

jobs:
  define-matrix:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.projects.outputs.projects }}
    steps:
      - id: projects
        run: | 
          echo 'projects=[{"path":"1.21.x/1.21","runTests":true}]' >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: define-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.define-matrix.outputs.projects) }}

    permissions:
      contents: read

    defaults:
      run:
        working-directory: ${{ matrix.project.path }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests and build
        if: matrix.project.runTests
        run: ./gradlew --no-daemon clean test build --stacktrace

      - name: Build only
        if: ${{ !matrix.project.runTests }}
        run: ./gradlew --no-daemon build --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.project.path }}
          path: |
            ${{ matrix.project.path }}/**/build/reports/tests/
            ${{ matrix.project.path }}/**/build/test-results/
